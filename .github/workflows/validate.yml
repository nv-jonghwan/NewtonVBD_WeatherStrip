name: CPU validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -c requirements/compute-constraints.txt -e .
      - run: python -m compileall -q src scripts tests
      - run: python -m unittest discover -s tests -v
      - run: bash -n scripts/python.sh scripts/run_headless.sh scripts/run_isaaclab.sh
