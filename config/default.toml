[assets]
robot_usd = "assets/fanuc/crx10ia_l.usd"
robot_prim = "/crx10ia_l"
physics_variant = "PhysX"
simready_profile = "Robot-Body-Runnable"
gripper_usd = "assets/robotiq_2f85/Robotiq_2F_85.usda"
gripper_prim = "/Robotiq_2F_85"
gripper_physics_variant = "Physx_Mimic"
gripper_grasp_offset_m = 0.160
gripper_open_angle_rad = 0.0
gripper_hold_angle_rad = 0.78

[scene]
robot_spacing_m = 1.80
robot_base_z_m = 0.0
table_half_extents_m = [0.62, 0.45, 0.20]
table_center_z_m = 0.20
table_friction = 0.15
stack_count = 3
stack_pitch_m = 0.025

[weatherstrip]
segments = 64
rest_radius_m = 0.28
minor_radius_m = 0.22
cross_section_radius_m = 0.010
total_mass_kg = 0.40
stretch_stiffness_n_m = 5000.0
stretch_damping_n_s_m = 0.1
shear_stiffness_n_m = 5000.0
shear_damping_n_s_m = 0.1
bend_stiffness_n_m = 1.20
bend_damping_n_m_s = 0.024
twist_stiffness_n_m = 0.40
twist_damping_n_m_s = 0.008
friction = 2.0

[simulation]
fps = 60
substeps = 8
solver_iterations = 8
ik_iterations = 8
admm_iterations = 4
mujoco_iterations = 8
gravity_m_s2 = -9.81
contact_stiffness_n_m = 5000.0
contact_damping_n_s_m = 10.0
# Effective fingertip/seal pair coefficients (VBD arithmetic shape mixing).
gripper_contact_stiffness_n_m = 50000.0
gripper_contact_damping_n_s_m = 15.0
# Robotiq master revolute drive: N*m/rad, N*m*s/rad, N*m.
gripper_drive_stiffness_nm_rad = 180.0
gripper_drive_damping_nm_s_rad = 8.0
gripper_max_torque_nm = 26.0
device = "cuda:0"

[trajectory]
ready_s = 0.80
descend_s = 0.70
grasp_s = 1.00
lift_s = 2.00
stretch_s = 1.20
hold_s = 0.50
relax_s = 1.00
sag_s = 0.80
release_s = 0.45
fall_s = 1.0
retract_s = 0.60
settle_s = 3.00
approach_height_m = 0.20
grip_depth_m = 0.017
sag_lowering_m = 0.025
clearance_m = 0.20
lift_height_m = 0.30
stretch_extension_m = 0.08
